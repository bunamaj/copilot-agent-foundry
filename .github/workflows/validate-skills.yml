name: Validate Skills

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Frontmatter Fields
        run: |
          errors=0
          for file in $(find . -name "SKILL.md"); do
            # Check if file starts with frontmatter delimiter ---
            if ! head -n 1 "$file" | grep -q "^---"; then
              echo "Error: $file missing leading '---'"
              errors=1
              continue
            fi
            
            # Check for required fields inside frontmatter
            if ! grep -q "^name:" "$file"; then
              echo "Error: $file missing 'name:'"
              errors=1
            fi
            if ! grep -q "^description:" "$file"; then
              echo "Error: $file missing 'description:'"
              errors=1
            fi
          done

          if [ $errors -ne 0 ]; then
            echo "Validation failed."
            exit 1
          fi
          echo "All SKILL.md files passed validation!"